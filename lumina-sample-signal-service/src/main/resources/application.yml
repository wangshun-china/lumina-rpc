server:
  port: 8084

spring:
  application:
    name: signal-analysis-node

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

lumina:
  rpc:
    consumer:
      enabled: false
    provider:
      enabled: true
    control-plane-url: ${LUMINA_RPC_CONTROL_PLANE_URL:http://localhost:8080}
    server:
      host: ${LUMINA_RPC_SERVER_HOST:127.0.0.1}
      port: 9084
    service:
      scan-packages: com.lumina.sample.signal.service

logging:
  level:
    com.lumina: ${LOG_LEVEL:DEBUG}
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
